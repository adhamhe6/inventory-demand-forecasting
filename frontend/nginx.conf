# SPA + reverse proxy to the FastAPI service (same origin: no CORS needed in production).
upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 55m;  # CSV imports (API enforces MAX_IMPORT_FILE_MB)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/csv;
    gzip_min_length 1024;

    # Security headers are included per SPA location (add_header in a location replaces
    # inherited ones). Proxied API/Swagger responses carry the API's own headers instead,
    # so the SPA's strict CSP doesn't break Swagger UI's CDN assets.

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location ~ ^/(api|health|docs|redoc|openapi\.json) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Fingerprinted build assets: cache forever.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
